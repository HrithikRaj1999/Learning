apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: mern-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-mongo
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nslookup mongo.mern-lab.svc.cluster.local; do echo waiting for mongo; sleep 2; done
      containers:
        - name: backend
          image: mern-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: MONGO_URI
              value: mongodb://mongo.mern-lab.svc.cluster.local:27017/tododb
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mern-lab
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
